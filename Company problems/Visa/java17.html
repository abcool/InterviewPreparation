\<p class="text-gray-600 mb-4"\>A deadlock occurs when two threads are blocked forever, each waiting for the other. This happens when they try to acquire locks on multiple resources in a different order. The key to prevention is a consistent lock acquisition order.\</p\>

    let collectionsChart, gcChart;

    function navigateTo(hash) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('nav-link-active'));
        
        const section = document.querySelector(hash);
        if (section) {
            section.classList.add('active', 'fade-in');
        }
        const link = document.querySelector(`.nav-link[href="${hash}"]`);
        if (link) {
            link.classList.add('nav-link-active');
        }
        
        // Handle sub-tabs default activation
        if (hash === '#core-concepts') {
            switchTab('core-concepts', 'collections');
        } else if (hash === '#concurrency') {
            switchTab('concurrency', 'concurrency-basics');
        } else if (hash === '#case-study') {
            document.getElementById('case-study-content').innerHTML = appData.caseStudy.content;
        } else {
            // Default to timeline if hash is invalid or home
             document.querySelector('#timeline').classList.add('active');
             document.querySelector('.nav-link[href="#timeline"]').classList.add('nav-link-active');
        }
    }
    
    function switchTab(group, tabId) {
        const contentContainer = document.getElementById(`${group}-content`);
        const tabButtons = document.querySelectorAll(`[data-tab^="${group.split('-')[0]}"]`);
        
        tabButtons.forEach(btn => btn.classList.remove('tab-button-active', 'bg-blue-600', 'text-white'));
        tabButtons.forEach(btn => btn.classList.add('text-gray-500', 'hover:bg-gray-200'));

        const activeButton = document.querySelector(`[data-tab="${tabId}"]`);
        activeButton.classList.add('tab-button-active', 'bg-blue-600', 'text-white');
        activeButton.classList.remove('text-gray-500', 'hover:bg-gray-200');

        if (tabId === 'collections') {
            contentContainer.innerHTML = appData.collections.content;
            renderCollectionsChart();
        } else if (tabId === 'memory') {
            contentContainer.innerHTML = appData.memory.content;
            renderGcChart();
        } else if(tabId === 'concurrency-basics') {
             contentContainer.innerHTML = appData.concurrencyBasics.content;
        } else if(tabId === 'concurrency-challenges') {
             contentContainer.innerHTML = appData.concurrencyChallenges.content;
             document.getElementById('run-deadlock-btn').addEventListener('click', runDeadlockAnimation);
        }
        contentContainer.classList.add('fade-in');
        setTimeout(() => contentContainer.classList.remove('fade-in'), 500);
    }

    function renderTimeline() {
        const container = document.querySelector('#timeline .sm\\:grid');
        let content = '';
        appData.timeline.forEach((item, index) => {
            const alignmentClass = index % 2 === 0 ? 'sm:justify-self-start sm:pr-8' : 'sm:justify-self-end sm:pl-8 sm:text-right';
            const dotAlignment = index % 2 === 0 ? 'sm:left-1/2 sm:-ml-2' : 'sm:right-1/2 sm:-mr-2';
            const ltsBadge = item.lts ? '<span class="bg-blue-100 text-blue-800 text-xs font-semibold mr-2 px-2.5 py-0.5 rounded-full">LTS</span>' : '';

            content += `
                <div class="relative sm:w-1/2 ${alignmentClass}">
                    <div class="timeline-item p-6 bg-white rounded-xl shadow-lg w-full" data-version="${item.version}">
                        <div class="absolute w-4 h-4 bg-blue-500 rounded-full mt-2 -top-1.5 ${dotAlignment}"></div>
                        <time class="block mb-2 text-sm font-semibold tracking-wide text-gray-500">${item.year}</time>
                        <h3 class="text-xl font-bold text-gray-800">Java ${item.version} ${ltsBadge}</h3>
                        <p class="text-gray-600">${item.title}</p>
                    </div>
                </div>
            `;
             if (index % 2 !== 0 && index < appData.timeline.length - 1) {
                content += '<div></div>'; // Skip a grid cell on the left
            }
        });
        container.innerHTML = content;

        document.querySelectorAll('.timeline-item').forEach(item => {
            item.addEventListener('click', (e) => {
                const version = e.currentTarget.dataset.version;
                displayFeatureDetails(version);
            });
        });
    }
    
    function displayFeatureDetails(version) {
        const versionData = appData.timeline.find(v => v.version === version);
        const panel = document.getElementById('feature-details-panel');
        if (!versionData) {
            panel.innerHTML = '';
            panel.classList.add('hidden');
            return;
        }
        
        let featuresHtml = versionData.features.map(feature => {
            const hasDetails = appData.featureDetails[feature];
            return `<li class="p-3 ${hasDetails ? 'bg-blue-50 hover:bg-blue-100 cursor-pointer rounded-lg' : 'bg-gray-50 rounded-lg'}" ${hasDetails ? `onclick="showCodeDetail('${feature}')"` : ''}>${feature}</li>`;
        }).join('');

        panel.innerHTML = `
            <div class="bg-white rounded-xl shadow-xl p-6 lg:p-8 max-w-4xl mx-auto fade-in">
                <h2 class="text-2xl font-bold mb-4">Key Features in Java ${version}</h2>
                <ul class="space-y-2 text-gray-700">${featuresHtml}</ul>
                <div id="code-detail-view" class="mt-6 hidden"></div>
            </div>
        `;
        panel.classList.remove('hidden');
        panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function showCodeDetail(featureKey) {
        const detail = appData.featureDetails[featureKey];
        const view = document.getElementById('code-detail-view');
        if (!detail) {
            view.innerHTML = '';
            view.classList.add('hidden');
            return;
        }
        view.innerHTML = `
            <div class="border-t border-gray-200 pt-6 fade-in">
                <h4 class="font-bold text-lg text-blue-700">${featureKey}</h4>
                <p class="text-gray-600 my-2">${detail.desc}</p>
                <div class="code-block font-mono text-sm">
                    <pre><code>${detail.code}</code></pre>
                </div>
            </div>
        `;
        view.classList.remove('hidden');
    }

        if (collectionsChart) collectionsChart.destroy();
        collectionsChart = new Chart(ctx, {
            type: 'bar',
            data: appData.collections.chartData,
            options: {
                responsive: true,

                plugins: {

                    tooltip: {
                        callbacks: {

                                const value = context.parsed.y;
                                label += appData.collections.tooltips[value.toString()] || 'N/A';
                                return label;
                            }
                        }
                    }
                },
                scales: {
                    y: {
                       ticks: {
                            callback: function(value) {
                               return appData.collections.tooltips[value.toString()] || '';
                           }
                       },
                       title: { display: true, text: 'Complexity' }
                    }
                }
            }
        });
    }
    
    function renderGcChart() {
         const ctx = document.getElementById('gcChart').getContext('2d');
         if (gcChart) gcChart.destroy();
         gcChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Serial', 'Parallel', 'G1', 'ZGC'],

                indexAxis: 'y',
                plugins: {

                },
                scales: {
                    x: { beginAtZero: true, max: 10, title: {display: true, text: 'Relative Score'} }
                }
            }
        });
    }

    function runDeadlockAnimation() {
        const btn = document.getElementById('run-deadlock-btn');
        btn.disabled = true;
        btn.textContent = 'Running...';
        
        const threadA = document.getElementById('threadA');
        const threadB = document.getElementById('threadB');
        const res1 = document.getElementById('res1');
        const res2 = document.getElementById('res2');
        const status = document.getElementById('deadlock-status');

        // Reset
        res1.style.backgroundColor = '#374151';
        res2.style.backgroundColor = '#374151';
        threadA.style.borderColor = '';
        threadB.style.borderColor = '';
        status.textContent = '';
        status.className = 'mt-4 text-center font-semibold h-6';

        setTimeout(() => {
            status.textContent = 'Thread A locks Resource 1';
            status.classList.add('text-blue-600');
            res1.style.backgroundColor = '#60a5fa'; // Blue
        }, 500);

         setTimeout(() => {
            status.textContent = 'Thread B locks Resource 2';
            status.classList.add('text-red-600');
            res2.style.backgroundColor = '#f87171'; // Red
        }, 1000);

        setTimeout(() => {
            status.textContent = 'Thread A tries to lock Resource 2 (held by B)';
            status.className = 'mt-4 text-center font-semibold h-6 text-blue-600';
        }, 1800);

        setTimeout(() => {
            status.textContent = 'Thread B tries to lock Resource 1 (held by A)';
            status.className = 'mt-4 text-center font-semibold h-6 text-red-600';
        }, 2600);
        
        setTimeout(() => {
            status.textContent = 'DEADLOCK! Circular wait detected.';
            status.className = 'mt-4 text-center font-bold h-6 text-xl text-red-700 animate-pulse';
            btn.disabled = false;
            btn.textContent = 'Run Simulation Again';
        }, 3500);
    }

    document.addEventListener('DOMContentLoaded', () => {
        const navLinks = document.querySelectorAll('.nav-link');
        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                navigateTo(e.currentTarget.getAttribute('href'));
                
                const mobileMenu = document.getElementById('mobile-menu');
                if(!mobileMenu.classList.contains('hidden')) {
                     mobileMenu.classList.add('hidden');
                }
            });
        });
        
        document.querySelectorAll('[data-tab]').forEach(button => {
            button.addEventListener('click', (e) => {
                const group = e.currentTarget.parentElement.nextElementSibling.id.replace('-content', '');
                switchTab(group, e.currentTarget.dataset.tab);
            });
        });
        
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        mobileMenuButton.addEventListener('click', () => {
            const mobileMenu = document.getElementById('mobile-menu');
            mobileMenu.classList.toggle('hidden');
        });

        renderTimeline();

        const initialHash = window.location.hash || '#timeline';
        navigateTo(initialHash);
    });
    
    // Make this function global so inline onclicks can find it
    window.showCodeDetail = showCodeDetail;
